[tools]
python = ["3.14", "3.13", "3.12", "3.11"]
uv = "latest"
ruff = "latest"
"pipx:jinja2-cli"="latest"
"cargo-binstall"="latest"
zizmor = "latest"

[task_config]
includes = ["./virtual_tasks.toml", "./tasks"]

[tasks.test]
description = "Run tests"

[tasks.fmt]
description = "Format source"

[tasks.fmt-check]
description = "Check formatting"

[tasks.lint]
description = "Lint the project"

[tasks.lint-fix]
description = "Run lint fixers"

[tasks.ci]
depends = ["test", "fmt-check", "lint"]
description = "Run CI tasks"

[tasks.build]
description = "Build the project in debug mode"
depends = [
    "build-image python-base",
    "build-image python-builder",
    "build-python-image 3.11",
    "build-python-image 3.12",
    "build-python-image 3.13",
    "build-python-image 3.14",
    "build-image rust-base",
    "build-image rust-builder",
    "build-image rust",
]

[tasks.build-image]
usage = '''
arg "<image>" help="Image to build"
'''
run = "docker buildx build --load -f baseimages/${usage_image?}.Dockerfile -t ghcr.io/mortenlj/mise-lib/${usage_image?}:latest ."

[tasks.build-python-image]
usage = '''
arg "<py_version>" help="Python version"
'''
run = "docker buildx build --load --build-arg PY_VERSION=${usage_py_version?} -f baseimages/python-prod.Dockerfile -t ghcr.io/mortenlj/mise-lib/python-${usage_py_version?}:latest ."

[tasks.release-build]
description = "Build the project"
depends = [ "build" ]
