name: Build base images

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    paths:
      - baseimages/**
      - mise.toml
      - rust/setup
  workflow_dispatch:
  schedule:
    - cron: '14 4 * * 5'

env:
  image_root: ghcr.io/${{ github.repository }}

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6
        with:
          fetch-depth: 0
          submodules: "true"
      - uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4
      - run: mise run extract-ci-info
        id: ci-info
    outputs:
      run-publish: ${{ steps.ci-info.outputs.run-publish }}
      version: ${{ steps.ci-info.outputs.version }}
      clean-version: ${{ steps.ci-info.outputs.clean-version }}
      tool-versions: ${{ steps.ci-info.outputs.tool-versions }}

  build-base:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    needs:
      - setup
    steps:
      - name: Set up QEMU
        id: qemu
        uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a # v4
        with:
          image: tonistiigi/binfmt:latest
          platforms: all
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4
      - name: Login to GitHub Packages Docker Registry
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and possibly push docker image ${{ env.image_root }}/${{ matrix.image }}
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294 # v7
        with:
          file: "./baseimages/base.Dockerfile"
          push: ${{ fromJSON(needs.setup.outputs.run-publish) }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ env.image_root }}/base:${{ fromJSON(needs.setup.outputs.clean-version) }}
            ${{ env.image_root }}/base:latest

  build-bases:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    needs:
      - setup
      - build-base
    strategy:
      matrix:
        image:
          - rust-base
          - python-base
    steps:
      - name: Set up QEMU
        id: qemu
        uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a # v4
        with:
          image: tonistiigi/binfmt:latest
          platforms: all
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4
      - name: Login to GitHub Packages Docker Registry
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and possibly push docker image ${{ env.image_root }}/${{ matrix.image }}
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294 # v7
        with:
          file: "./baseimages/${{ matrix.image }}.Dockerfile"
          push: ${{ fromJSON(needs.setup.outputs.run-publish) }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ env.image_root }}/${{ matrix.image }}:${{ fromJSON(needs.setup.outputs.clean-version) }}
            ${{ env.image_root }}/${{ matrix.image }}:latest

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    needs:
      - setup
      - build-bases
    strategy:
      matrix:
        image:
          - rust-builder
          - rust
          - python-builder
    steps:
      - name: Set up QEMU
        id: qemu
        uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a # v4
        with:
          image: tonistiigi/binfmt:latest
          platforms: all
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4
      - name: Login to GitHub Packages Docker Registry
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and possibly push docker image ${{ env.image_root }}/${{ matrix.image }}
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294 # v7
        with:
          file: "./baseimages/${{ matrix.image }}.Dockerfile"
          push: ${{ fromJSON(needs.setup.outputs.run-publish) }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ env.image_root }}/${{ matrix.image }}:${{ fromJSON(needs.setup.outputs.clean-version) }}
            ${{ env.image_root }}/${{ matrix.image }}:latest

  build-python:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    needs:
      - setup
      - build-bases
    strategy:
      matrix:
        py_version: ${{ fromJSON(needs.setup.outputs.tool-versions).python }}
    steps:
      - name: Set up QEMU
        id: qemu
        uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a # v4
        with:
          image: tonistiigi/binfmt:latest
          platforms: all
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4
      - name: Login to GitHub Packages Docker Registry
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and possibly push docker image ${{ env.image_root }}/${{ matrix.image }}
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294 # v7
        with:
          file: "./baseimages/python-prod.Dockerfile"
          build-args: |
            PY_VERSION=${{ matrix.py_version }}
          push: ${{ fromJSON(needs.setup.outputs.run-publish) }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ env.image_root }}/python-${{ matrix.py_version }}:${{ fromJSON(needs.setup.outputs.clean-version) }}
            ${{ env.image_root }}/python-${{ matrix.py_version }}:latest

  cleanup:
    name: Cleanup
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: build
    permissions:
      packages: write
    strategy:
      matrix:
        image:
          - rust-base
          - rust-builder
          - rust
          - python-base
          - python-builder
          - python-3.11
          - python-3.12
          - python-3.13
          - python-3.14
    steps:
      - name: Cleanup main images
        uses: dataaxiom/ghcr-cleanup-action@cd0cdb900b5dbf3a6f2cc869f0dbb0b8211f50c4 # v1.0.16
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          package: mise-lib/${{ matrix.image }}
          keep-n-tagged: 5
          older-than: 4 weeks
          delete-untagged: true
          delete-ghost-images: true
          delete-orphaned-images: true
          delete-partial-images: true
