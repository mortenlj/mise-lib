name: Build base images

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    paths:
      - baseimages/**
      - mise.toml
      - rust/setup
  workflow_dispatch:
  schedule:
    - cron: '14 4 * * 5'

env:
  image_root: ghcr.io/${{ github.repository }}

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: "true"
          persist-credentials: false
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
      - run: mise run extract-ci-info
        id: ci-info
    outputs:
      run-publish: ${{ steps.ci-info.outputs.run-publish }}
      version: ${{ steps.ci-info.outputs.version }}
      clean-version: ${{ steps.ci-info.outputs.clean-version }}
      tool-versions: ${{ steps.ci-info.outputs.tool-versions }}

  build-base:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    needs:
      - setup
    steps:
      - name: Set up QEMU
        id: qemu
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          image: tonistiigi/binfmt:latest
          platforms: all
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Login to GitHub Packages Docker Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and possibly push docker image ${{ env.image_root }}/${{ matrix.image }}
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          file: "./baseimages/base.Dockerfile"
          push: ${{ fromJSON(needs.setup.outputs.run-publish) }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ env.image_root }}/base:${{ fromJSON(needs.setup.outputs.clean-version) }}
            ${{ env.image_root }}/base:latest

  build-bases:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    needs:
      - setup
      - build-base
    strategy:
      matrix:
        image:
          - rust-base
          - python-base
    steps:
      - name: Set up QEMU
        id: qemu
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          image: tonistiigi/binfmt:latest
          platforms: all
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Login to GitHub Packages Docker Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and possibly push docker image ${{ env.image_root }}/${{ matrix.image }}
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          file: "./baseimages/${{ matrix.image }}.Dockerfile"
          push: ${{ fromJSON(needs.setup.outputs.run-publish) }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ env.image_root }}/${{ matrix.image }}:${{ fromJSON(needs.setup.outputs.clean-version) }}
            ${{ env.image_root }}/${{ matrix.image }}:latest

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    needs:
      - setup
      - build-bases
    strategy:
      matrix:
        image:
          - rust-builder
          - rust
          - python-builder
    steps:
      - name: Set up QEMU
        id: qemu
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          image: tonistiigi/binfmt:latest
          platforms: all
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Login to GitHub Packages Docker Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and possibly push docker image ${{ env.image_root }}/${{ matrix.image }}
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          file: "./baseimages/${{ matrix.image }}.Dockerfile"
          push: ${{ fromJSON(needs.setup.outputs.run-publish) }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ env.image_root }}/${{ matrix.image }}:${{ fromJSON(needs.setup.outputs.clean-version) }}
            ${{ env.image_root }}/${{ matrix.image }}:latest

  build-python:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    needs:
      - setup
      - build-bases
    strategy:
      matrix:
        py_version: ${{ fromJSON(needs.setup.outputs.tool-versions).python }}
    steps:
      - name: Set up QEMU
        id: qemu
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          image: tonistiigi/binfmt:latest
          platforms: all
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Login to GitHub Packages Docker Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and possibly push docker image ${{ env.image_root }}/${{ matrix.image }}
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          file: "./baseimages/python-prod.Dockerfile"
          build-args: |
            PY_VERSION=${{ matrix.py_version }}
          push: ${{ fromJSON(needs.setup.outputs.run-publish) }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ env.image_root }}/python-${{ matrix.py_version }}:${{ fromJSON(needs.setup.outputs.clean-version) }}
            ${{ env.image_root }}/python-${{ matrix.py_version }}:latest

  cleanup:
    name: Cleanup
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: build
    permissions:
      packages: write
    strategy:
      matrix:
        image:
          - rust-base
          - rust-builder
          - rust
          - python-base
          - python-builder
          - python-3.11
          - python-3.12
          - python-3.13
          - python-3.14
    steps:
      - name: Cleanup main images
        uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f # v1.2.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          package: mise-lib/${{ matrix.image }}
          keep-n-tagged: 5
          older-than: 4 weeks
          delete-untagged: true
          delete-ghost-images: true
          delete-orphaned-images: true
          delete-partial-images: true
