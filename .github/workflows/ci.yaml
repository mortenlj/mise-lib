name: build docker

on:
  workflow_call:
    inputs:
      ci-tasks:
        description: JSON data with ci tasks in use in this project
        required: true
        type: string

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        task: ${{ fromJSON(inputs.ci-tasks) }}
    steps:
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: "true"
          persist-credentials: false
      - run: mise run ${{ matrix.task.cmd }}
