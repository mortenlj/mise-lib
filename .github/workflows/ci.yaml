name: build docker

on:
  workflow_call:
    inputs:
      ci-tasks:
        description: JSON data with ci tasks in use in this project
        required: true
        type: string

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        task: ${{ fromJSON(inputs.ci-tasks) }}
    steps:
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: "true"
          persist-credentials: false
      - run: mise run ${{ matrix.task.cmd }}
