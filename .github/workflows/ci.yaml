name: build docker

on:
  workflow_call:
    inputs:
      ci-tasks:
        description: JSON data with ci tasks in use in this project
        required: true
        type: string

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    strategy:
      matrix:
        task: ${{ fromJSON(inputs.ci-tasks) }}
    steps:
      - uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
          submodules: "true"
      - run: mise run ${{ matrix.task.cmd }}
