name: build docker

on:
  workflow_call:
    inputs:
      main-image:
        description: The full image to produce (without tag)
        required: true
        type: string
      clean-version:
        description: Version to use for image tag (clean)
        required: true
        type: string
      tool-versions:
        description: JSON data with tool versions in use in this project
        required: true
        type: string
      main-branch:
        description: The ref of the main branch in this repo
        required: false
        type: string
        default: refs/heads/main
      manifests-task:
        description: The task used to generate manifests
        required: false
        type: string
        default: k8s:manifests
    secrets:
      GHCR_PASSWORD:
        required: true


jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      packages: write
      checks: write
      pull-requests: write
    steps:
      - uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4
      - name: Set up QEMU
        id: qemu
        uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a # v4
        with:
          image: tonistiigi/binfmt:latest
          platforms: all
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4
      - name: Login to GitHub Packages Docker Registry
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PASSWORD }}
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6
        with:
          fetch-depth: 0
          submodules: "true"
      - name: Build and possibly push docker image
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294 # v7
        with:
          context: "."
          push: '${{ github.ref == inputs.main-branch }}'
          platforms: linux/amd64,linux/arm64
          secrets: GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }}
          build-args: |
            MORTENLJ_MISE_LIB_CLEAN_VERSION=${{ inputs.clean-version }}
            PY_VERSION=${{ fromJSON(inputs.tool-versions).python[0] }}
            RUST_VERSION=${{ fromJSON(inputs.tool-versions).rust[0] }}
          tags: |
            ${{ inputs.main-image }}:${{ inputs.clean-version }}
            ${{ inputs.main-image }}:latest
      - name: Assemble manifests
        run: mise run "${{ inputs.manifests-task }}" "${{ inputs.main-image }}"
        env:
          MORTENLJ_MISE_LIB_CLEAN_VERSION: ${{ inputs.clean-version }}
      - name: Save manifests for later deploy
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        with:
          name: manifests
          path: mise-output/*.yaml
