name: build docker

on:
  workflow_call:
    inputs:
      main-image:
        description: The full image to produce (without tag)
        required: true
        type: string
      clean-version:
        description: Version to use for image tag (clean)
        required: true
        type: string
      tool-versions:
        description: JSON data with tool versions in use in this project
        required: true
        type: string
      main-branch:
        description: The ref of the main branch in this repo
        required: false
        type: string
        default: refs/heads/main
      manifests-task:
        description: The task used to generate manifests
        required: false
        type: string
        default: k8s:manifests
    secrets:
      GHCR_PASSWORD:
        required: true


jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      packages: write
      checks: write
      pull-requests: write
    steps:
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          cache: false
      - name: Set up QEMU
        id: qemu
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          image: tonistiigi/binfmt:latest
          platforms: all
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Login to GitHub Packages Docker Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PASSWORD }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: "true"
          persist-credentials: false
      - name: Build and possibly push docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: "."
          push: '${{ github.ref == inputs.main-branch }}'
          platforms: linux/amd64,linux/arm64
          secrets: GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }}
          build-args: |
            MORTENLJ_MISE_LIB_CLEAN_VERSION=${{ inputs.clean-version }}
            PY_VERSION=${{ fromJSON(inputs.tool-versions).python[0] }}
            RUST_VERSION=${{ fromJSON(inputs.tool-versions).rust[0] }}
          tags: |
            ${{ inputs.main-image }}:${{ inputs.clean-version }}
            ${{ inputs.main-image }}:latest
      - name: Assemble manifests
        run: mise run "${INPUTS_MANIFESTS_TASK}" "${INPUTS_MAIN_IMAGE}"
        env:
          MORTENLJ_MISE_LIB_CLEAN_VERSION: ${{ inputs.clean-version }}
          INPUTS_MANIFESTS_TASK: ${{ inputs.manifests-task }}
          INPUTS_MAIN_IMAGE: ${{ inputs.main-image }}
      - name: Save manifests for later deploy
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: manifests
          path: mise-output/*.yaml
